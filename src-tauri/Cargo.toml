[package]
name = "raw-viewer"
version = "0.1.0"
description = "Cross-platform RAW image viewer and non-destructive editor"
authors = ["Hyunseok Byun"]
edition = "2021"
license = "MIT"

[lib]
name = "raw_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = { version = "1", features = ["parallel"] }
bindgen = "0.71"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ts-rs = "10"
rayon = "1"
blake3 = "1"
zstd = "0.13"
half = "2"
dirs = "6"
rusqlite = { version = "0.32", features = ["bundled"] }
base64 = "0.22"
kamadak-exif = "0.6"
trash = "5"
notify = "8"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
image = "0.25"
jpeg-encoder = { version = "0.6", features = ["std"] }
lcms2 = "6"
uuid = { version = "1", features = ["v4"] }
little_exif = "0.6"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-store = "2"
quick-xml = "0.37"
ureq = { version = "2", default-features = false, features = ["native-tls"] }
native-tls = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSResponder",
    "NSMenu",
    "NSMenuItem",
    "NSPasteboard",
    "NSWorkspace",
    "NSRunningApplication",
    "NSScreen",
    "NSColorSpace",
    "NSDocumentController",
    "NSGraphics",
    "block2",
] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray", "NSData", "NSURL", "NSError"] }

[features]
default = ["libraw"]
libraw = []

[profile.release]
panic = "unwind"

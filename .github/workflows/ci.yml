name: CI

on:
  pull_request:
    branches: [dev, prod]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/cache@v4
        with:
          path: |
            src-tauri/vendor
            src-tauri/resources/lensfun
            src-tauri/binaries
          key: vendor-${{ runner.os }}-${{ hashFiles('src-tauri/libraw.pin', 'src-tauri/lensfun.pin', 'scripts/fetch-dnglab.sh') }}

      - uses: actions/cache@v4
        with:
          path: tests/fixtures/tier1
          key: fixtures-${{ hashFiles('scripts/fetch-fixtures.sh') }}

      - name: Install libomp
        run: brew install libomp

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Restore vendored sources
        run: |
          bash scripts/sync-vendor.sh
          bash scripts/sync-lensfun.sh
          bash scripts/fetch-dnglab.sh
          bash scripts/fetch-fixtures.sh

      - name: Prettier
        run: bunx prettier --check "src/**/*.{ts,tsx,css}" "*.{json,html}"

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Lint
        run: bun run lint

      - name: Frontend tests
        run: bun run test

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        working-directory: src-tauri
        run: cargo test

      - name: E2E decode smoke
        run: |
          cargo build --manifest-path src-tauri/Cargo.toml
          bash scripts/e2e-decode.sh

      - name: Frontend build
        run: bun run build

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          APP_VERSION=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          if [ "v$APP_VERSION" != "$GITHUB_REF_NAME" ]; then
            printf 'tag %s does not match tauri.conf.json version %s\n' "$GITHUB_REF_NAME" "$APP_VERSION" >&2
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/cache@v4
        with:
          path: |
            src-tauri/vendor
            src-tauri/resources/lensfun
            src-tauri/binaries
          key: vendor-${{ runner.os }}-${{ hashFiles('src-tauri/libraw.pin', 'src-tauri/lensfun.pin', 'scripts/fetch-dnglab.sh') }}

      - name: Install libomp
        run: brew install libomp

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Restore vendored sources
        run: |
          bash scripts/sync-vendor.sh
          bash scripts/sync-lensfun.sh
          bash scripts/fetch-dnglab.sh

      - name: Verify (clippy, tests)
        working-directory: src-tauri
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: Configure Apple code signing
        env:
          APPLE_CERTIFICATE_SECRET: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD_SECRET: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY_SECRET: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID_SECRET: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD_SECRET: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID_SECRET: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE_SECRET" ]; then
            {
              echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE_SECRET"
              echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD_SECRET"
              echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY_SECRET"
            } >> "$GITHUB_ENV"
            echo "code signing: enabled"
          else
            echo "code signing: skipped (APPLE_CERTIFICATE not set)"
          fi
          if [ -n "$APPLE_ID_SECRET" ]; then
            {
              echo "APPLE_ID=$APPLE_ID_SECRET"
              echo "APPLE_PASSWORD=$APPLE_PASSWORD_SECRET"
              echo "APPLE_TEAM_ID=$APPLE_TEAM_ID_SECRET"
            } >> "$GITHUB_ENV"
            echo "notarization: enabled"
          else
            echo "notarization: skipped (APPLE_ID not set)"
          fi

      - name: Build app bundle
        run: bun run tauri build

      - name: Collect artifacts
        run: |
          mkdir -p dist-release
          cp src-tauri/target/release/bundle/dmg/*.dmg dist-release/
          shasum -a 256 dist-release/*.dmg > dist-release/SHA256SUMS.txt
          cat dist-release/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: raw-viewer-dmg
          path: dist-release/*

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: true
          files: dist-release/*
          body: |
            raw-viewer ${{ github.ref_name }} (macOS Apple Silicon)

            서명되지 않은 빌드의 경우 최초 실행 시 다음 명령으로 격리 속성을 해제해야 합니다:
            `xattr -cr /Applications/raw-viewer.app`
